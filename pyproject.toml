[project]
name = "pefftacular"
dynamic = ["version"]
description = "A pure-Python library for reading and writing PEFF (PSI Extended FASTA Format) files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["peff", "proteomics", "fasta", "bioinformatics", "mass-spectrometry"]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/pefftacular"
Repository = "https://github.com/tacular-omics/pefftacular"
Documentation = "https://tacular-omics.github.io/pefftacular/"
Issues = "https://github.com/tacular-omics/pefftacular/issues"
Changelog = "https://github.com/tacular-omics/pefftacular/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Source, tests and paperwork only: not the spec PDF, docs site or repo tooling.
only-include = [
    "src/pefftacular",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pefftacular"]

[tool.hatch.version]
path = "src/pefftacular/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "fastatacular>=1.0,<2",
    "hypothesis>=6.100",
    "pandas>=2.2",
    "polars>=1.0",
    "pytest>=9",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pefftacular"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
